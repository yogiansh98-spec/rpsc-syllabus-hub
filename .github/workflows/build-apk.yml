name: Build Android debug APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "catalog/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "scripts/validate_catalog.py"
      - "scripts/test_catalog.py"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android API 36 using runner SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Validate starter catalog
        run: |
          python3 scripts/validate_catalog.py
          python3 scripts/test_catalog.py
      - name: Assemble debug APK
        env:
          CATALOG_URL: ${{ vars.CATALOG_URL }}
        run: gradle --no-daemon :app:assembleDebug -PcatalogUrl="$CATALOG_URL"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: syllabus-hub-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
