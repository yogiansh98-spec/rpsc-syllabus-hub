name: Validate catalog and review official syllabus links
on:
  push:
    paths:
      - "catalog/**"
      - "scripts/**"
      - ".github/workflows/catalog-check.yml"
  schedule:
    - cron: "19 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check catalog structure and official hosts
        run: python3 scripts/validate_catalog.py
      - name: Link health review (does not publish)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/check_links.py
      - name: Upload report
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: rpsc-link-health-report
          path: link_health_report.json
          if-no-files-found: ignore
