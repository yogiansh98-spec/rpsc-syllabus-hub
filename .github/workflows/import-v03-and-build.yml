name: Import v0.3 sources and build first Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-v03-and-build.yml"
      - "RPSC_Syllabus_Hub_Android_App_v0_3_Compact_Categories.zip"

permissions:
  contents: write

jobs:
  import-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Unpack uploaded project ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rpsc-source"
          unzip -q RPSC_Syllabus_Hub_Android_App_v0_3_Compact_Categories.zip -d "$RUNNER_TEMP/rpsc-source"
          test -f "$RUNNER_TEMP/rpsc-source/RPSC_Syllabus_Hub_App_v0_3/app/build.gradle.kts"
          cp -a "$RUNNER_TEMP/rpsc-source/RPSC_Syllabus_Hub_App_v0_3/." .
          echo "Android project extracted successfully"
      - name: Validate catalog
        run: |
          python3 scripts/validate_catalog.py
          python3 scripts/test_catalog.py
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android API 36 using runner SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rpsc-syllabus-hub-first-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Commit unpacked source files on successful build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore README.md build.gradle.kts settings.gradle.kts gradle.properties app catalog docs scripts .github/workflows/build-apk.yml .github/workflows/catalog-check.yml
          if ! git diff --cached --quiet; then
            git commit -m "Import verified v0.3 Android source from uploaded ZIP"
            git push origin HEAD:main
          fi
