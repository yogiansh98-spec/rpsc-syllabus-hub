name: Publish test APK for direct download

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-test-apk.yml"
      - "app/**"
      - "catalog/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Validate syllabus catalog
        run: |
          python3 scripts/validate_catalog.py
          python3 scripts/test_catalog.py
      - name: Build debug APK
        env:
          CATALOG_URL: ${{ vars.CATALOG_URL }}
        run: gradle --no-daemon :app:assembleDebug -PcatalogUrl="$CATALOG_URL"
      - name: Publish GitHub prerelease with APK attachment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.5.2-explore-test" \
            "app/build/outputs/apk/debug/app-debug.apk#RPSC-Syllabus-Hub-v0.5.2.apk" \
            --target "$GITHUB_SHA" \
            --title "Syllabus Hub v0.5.2 - Explore Bottom Tab" \
            --prerelease \
            --notes "Testing build, not a Play Store or government release. The app is not affiliated with RPSC. Online catalog refresh on app resume; Previous Year Papers and Exam Study Plan are Coming Soon in the Explore bottom tab. Official syllabus PDFs are not yet populated."
