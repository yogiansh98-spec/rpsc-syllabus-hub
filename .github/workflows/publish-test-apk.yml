name: Publish test APK for direct download

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-test-apk.yml"
      - "app/src/main/java/**"
      - "app/build.gradle.kts"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Validate syllabus catalog
        run: |
          python3 scripts/validate_catalog.py
          python3 scripts/test_catalog.py
      - name: Build debug APK
        env:
          CATALOG_URL: ${{ vars.CATALOG_URL }}
        run: gradle --no-daemon :app:assembleDebug -PcatalogUrl="$CATALOG_URL"
      - name: Publish GitHub prerelease with APK attachment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.7.0-multilingual-test" \
            "app/build/outputs/apk/debug/app-debug.apk#RPSC-Syllabus-Hub-v0.7.0.apk" \
            --target "$GITHUB_SHA" \
            --title "Syllabus Hub v0.7.0 - Multilingual Syllabus Support" \
            --prerelease \
            --notes "Testing build, not a Play Store or government release. The app is not affiliated with RPSC. Online exam_categories and Explore categories refresh from validated JSON. New exam categories and exams can be added without another APK. Three verified official Senior Teacher 2025 PDFs are available; remaining subjects pending verification. Multilingual PDF URL handling is enabled. Original official and independent Hindi translation files remain separately labeled. Any Hindi translation link is added only once its hosted PDF exists."
